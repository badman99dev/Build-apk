name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: M3U8Extractor-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload APK to tempserv
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "APK not found!"
            find app/build -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          pip install tempserv-cli 2>/dev/null
          LINK=$(tempserv upload "$APK_PATH" --expiry 24h 2>/dev/null || echo "TEMPSERV_FAILED")
          echo "===APK_LINK=== $LINK"
